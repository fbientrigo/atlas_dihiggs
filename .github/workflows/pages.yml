name: Deploy Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: site/package-lock.json

      - name: Install Doxygen
        run: |
          mkdir -p "$HOME/.local/opt/doxygen"
          curl -sSL https://www.doxygen.nl/files/doxygen-1.12.0.linux.bin.tar.gz | tar -xz -C "$HOME/.local/opt/doxygen" --strip-components=1
          echo "$HOME/.local/opt/doxygen/bin" >> $GITHUB_PATH

      - name: Install Python API generation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install griffe

      - name: Install Node dependencies
        working-directory: site
        run: npm ci

      - name: Generate API documentation
        working-directory: site
        run: npm run api

      - name: Build documentation site
        working-directory: site
        run: npm run build
        env:
          BASE_PATH: /atlas_dihiggs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
