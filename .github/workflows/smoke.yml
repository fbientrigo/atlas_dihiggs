name: Fresh-clone smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      # No LFS filter, as on a plain clone: dihiggs/.gitattributes routes **/*.csv to LFS but 19 CSVs are plain
      # blobs, so with the runner's filter `git status` shows them modified. Drop this once dihiggs renormalizes.
      - run: sudo git lfs uninstall --system; git lfs uninstall
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0  # check_workspace reads the dihiggs authority commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y libgsl-dev
      - run: make setup
      - run: make smoke
      - run: |
          git submodule foreach --quiet 'git status --short --untracked-files=no | sed "s|^|$name: |"'
      - run: .venv/bin/python scripts/check_workspace.py
